services:
  registration-web-api:
    build:
      dockerfile: RegistrationWebAPI/Dockerfile
    container_name: apsim-registration-webapi
    env_file:
      - ./RegistrationWebAPI/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RegistrationDb: Data Source=/app/data/APSIMRegistrationSystemWebAPI.db
    ports:
      - "8088:80"
    volumes:
      - registration_api_db:/app/data
    restart: unless-stopped

  registration-web-app:
    build:
      dockerfile: RegistrationWebApp/Dockerfile
    container_name: apsim-registration-webapp
    env_file:
      - ./RegistrationWebApp/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WebApi__BaseUrl: http://registration-web-api/
    ports:
      - "8089:80"
    depends_on:
      - registration-web-api
    restart: unless-stopped

volumes:
  registration_api_db:
